name: Build Loud Reader for macOS (compact)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'desktop-swift/**', 'src/**', 'tools/**', 'desktop/build/icon.png', '.github/workflows/build-mac-compact.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the app page from src/
        run: |
          mkdir -p desktop-swift/app
          python3 tools/build_html.py desktop-swift/app/index.html
      - name: Build app + dmg + zip
        run: ./desktop-swift/build.sh 3.6.2
      - name: Self-test (launch the real app, check storage / import / backup)
        run: |
          APPBIN="desktop-swift/build/Loud Reader.app/Contents/MacOS/LoudReader"
          set +e
          APPDIR="$PWD/desktop-swift/build/Loud Reader.app"
          : > "$PWD/selftest.log"
          perl -e 'alarm 170; exec @ARGV' open -n -W --env LR_SELFTEST=1 --stdout "$PWD/selftest.log" --stderr "$PWD/selftest.log" "$APPDIR"
          echo "exit code: $?"
          head -60 selftest.log
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -3
          grep -q '"ok":true' selftest.log
      - uses: actions/upload-artifact@v4
        with:
          name: LoudReader-macOS-compact
          path: |
            desktop-swift/build/*.dmg
            desktop-swift/build/*.zip
      - name: Publish as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "mac-compact-v3.6.2" desktop-swift/build/*.dmg desktop-swift/build/*.zip --title "Loud Reader 3.6.2 for macOS (compact)" --notes "Small build (uses the Mac's own web engine). Unsigned: on first launch right-click the app, choose Open, then Open again." || gh release upload "mac-compact-v3.6.2" desktop-swift/build/*.dmg desktop-swift/build/*.zip --clobber
